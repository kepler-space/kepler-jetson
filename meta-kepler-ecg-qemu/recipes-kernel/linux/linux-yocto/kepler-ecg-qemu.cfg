# Emulated ECG SSD
CONFIG_BLK_DEV_NVME=y

# Emulated OBC UART (16550 on PCI)
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_PCI=y

# EEPROM driver, as on the ECG
CONFIG_EEPROM_AT24=m

# Simulated blade ID GPIOs
CONFIG_GPIOLIB=y
CONFIG_GPIO_CDEV=y
CONFIG_CONFIGFS_FS=y
CONFIG_GPIO_SIM=y

# SCTP, as on the ECG
CONFIG_IP_SCTP=m
CONFIG_NETFILTER_XT_MATCH_SCTP=m
CONFIG_INET_SCTP_DIAG=m

# Emulated PPS (/dev/pps0) for chrony's PPS refclock, pulsing from a kernel timer
CONFIG_PPS=y
CONFIG_PPS_CLIENT_KTIMER=y
