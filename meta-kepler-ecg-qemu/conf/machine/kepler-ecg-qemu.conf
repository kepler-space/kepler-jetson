#@TYPE: Machine
#@NAME: ECG V1 QEMU
#@DESCRIPTION: Emulated Kepler ECG for running the ECG software on QEMU (arm64 virt)

# QEMU has no model of the Jetson AGX Orin, so this runs the ECG userspace on
# the generic arm64 virt machine with linux-yocto. Tegra specific software
# (CUDA, NVIDIA drivers, bootloader updates) is not included.
MACHINEOVERRIDES =. "qemuarm64:"

require conf/machine/qemuarm64.conf

# Docker needs more than the default 256 MiB
QB_MEM = "-m 4096"

# Keep kernel interface names, like the ECG's eth0
QB_KERNEL_CMDLINE_APPEND += "net.ifnames=0"

# Emulated ECG peripherals:
# - NVMe SSD (/dev/ssd1), backed by a qcow2 disk image in the deploy directory
# - 16550 UART standing in for the OBC UART (ttyS0); QEMU prints the host pty
#   it is connected to
QB_OPT_APPEND:append = " \
    -drive file=@DEPLOY_DIR_IMAGE@/kepler-ecg-qemu-ssd1.qcow2,if=none,id=ssd1,format=qcow2 \
    -device nvme,serial=kepler-ssd1,drive=ssd1 \
    -chardev pty,id=obc -device pci-serial,chardev=obc \
"
EXTRA_IMAGEDEPENDS += "kepler-ecg-qemu-ssd"

MACHINE_EXTRA_RDEPENDS += "kepler-ecg-qemu-blade-id kepler-ecg-qemu-obc-uart"
